<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f5f2">
  <title>さわる</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="screen"><div id="tiles" class="tiles"></div></main>

  <section id="stage" class="screen hidden">
    <header class="top">
      <button id="btn-home" class="ghost" aria-label="back">←</button>
      <button id="word" class="word" aria-label="say it">
        <span id="w-kana" class="kana"></span>
        <span id="w-romaji" class="romaji"></span>
      </button>
      <span class="ghost spacer"></span>
    </header>
    <div id="canvas-wrap"><canvas id="cv"></canvas></div>
    <nav class="bottom">
      <button id="btn-prev" class="ghost" aria-label="previous">‹</button>
      <button id="btn-reset" class="ghost small" aria-label="reset">↺</button>
      <button id="btn-next" class="ghost" aria-label="next">›</button>
    </nav>
  </section>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fluid.js"></script>
  <script src="js/softbody.js"></script>
  <script src="js/scenes/fuwafuwa.js"></script>
  <script src="js/scenes/tsurutsuru.js"></script>
  <script src="js/scenes/mochimochi.js"></script>
  <script src="js/scenes/purupuru.js"></script>
  <script src="js/scenes/fluids.js"></script>
  <script src="js/scenes/zarazara.js"></script>
  <script src="js/scenes/sarasara.js"></script>
  <script src="js/scenes/puchipuchi.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
